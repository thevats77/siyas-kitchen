<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Siya's Kitchen</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .emoji { font-size: 64px; }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        color: #111827;
      }
      p {
        margin: 0;
        font-size: 16px;
        color: #6B7280;
        max-width: 320px;
      }
      button {
        margin-top: 24px;
        height: 56px;
        padding: 0 28px;
        border-radius: 16px;
        border: none;
        background: #22C55E;
        color: white;
        font-size: 17px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="emoji">🍽️</div>
      <h1>You're Offline</h1>
      <p>Siya's Kitchen needs an internet connection to load your latest orders.</p>
      <button onclick="location.reload()">Try Again</button>
    </div>
  </body>
</html>
